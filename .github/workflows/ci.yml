name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -DCMAKE_BUILD_TYPE=Release -DORDERBOOK_WARNINGS_AS_ERRORS=ON -S . -B build

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -S . -B build

      - name: Build
        run: cmake --build build --parallel --target orderbook_tests

      - name: Test
        run: ctest --test-dir build --output-on-failure

  consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -DCMAKE_BUILD_TYPE=Release -S tests/consumer -B build-consumer

      - name: Build
        run: cmake --build build-consumer --parallel

      - name: Run
        run: ./build-consumer/consumer

      - name: Check that only the library came along
        run: |
          if cmake --build build-consumer --target help | grep -E "orderbook_tests|orderbook_benchmark|orderbook_profile|gtest|benchmark"; then
            echo "ERROR: tests or benchmarks were pulled in"
            exit 1
          fi
